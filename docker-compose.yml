services:
  chesscog:
    build:
      context: ./chesscog-service
      dockerfile: Dockerfile
    image: jev-chesscog:latest
    container_name: jev-chesscog
    restart: unless-stopped
    profiles:
      - chesscog
    environment:
      - PYTHONUNBUFFERED=1

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jev-chess:latest
    container_name: jev-chess
    restart: unless-stopped
    ports:
      - "43173:43173"
    environment:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
      - SITE_HMAC_KEY=${SITE_HMAC_KEY:-}
      - SITE_PASSWORD_HMAC=${SITE_PASSWORD_HMAC:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diset di .env}
      - NODE_ENV=production
      - JEV_DATA_DIR=/app/data
      - CHESSCOG_URL=http://chesscog:8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  cftunnel-jev-chess:
    image: cloudflare/cloudflared:latest
    container_name: cftunnel-jev-chess
    restart: unless-stopped
    network_mode: host
    profiles:
      - cloudflare
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --protocol http2 run
