services:
  postgres:
    image: postgres:15-alpine
    container_name: jev-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=jev
      - POSTGRES_PASSWORD=jev_chess_dev
      - POSTGRES_DB=jev_chess
    ports:
      - "5432:5432"
    volumes:
      - jev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev_chess"]
      interval: 10s
      timeout: 5s
      retries: 5

  chesscog:
    build:
      context: ./chesscog-service
      dockerfile: Dockerfile
    image: jev-chesscog:latest
    container_name: jev-chesscog
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./chesscog-service/server.py:/app/server.py:ro

  yolo11:
    build:
      context: ./yolo11-service
      dockerfile: Dockerfile
    image: jev-yolo11:latest
    container_name: jev-yolo11
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - YOLO_MODEL_PATH=/app/models/best.pt
      - YOLO_MODEL_URL=${YOLO_MODEL_URL:-https://huggingface.co/dopaul/chess-piece-detector-merged-v2/resolve/main/best.pt}
      - YOLO_CONF_THRESHOLD=${YOLO_CONF_THRESHOLD:-0.25}
    volumes:
      - ./models/yolo11:/app/models
      - ./yolo11-service/server.py:/app/server.py:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jev-chess:latest
    container_name: jev-chess
    restart: unless-stopped
    ports:
      - "43173:43173"
    environment:
      - TYPESAFE_API_KEY=
      - KENARI_API_KEY=kn-2d8e9086471b9f5a62ed9bc47d233cd0e595e1e4c2ff6ba6${TYPESAFE_API_KEY}
      - SITE_HMAC_KEY=${SITE_HMAC_KEY:-}
      - SITE_PASSWORD_HMAC=${SITE_PASSWORD_HMAC:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diset di .env}
      - DATABASE_URL=postgresql://jev:jev_chess_dev@postgres:5432/jev_chess?sslmode=disable
      - NODE_ENV=production
      - JEV_DATA_DIR=/app/data
      - CHESSCOG_URL=http://chesscog:8000
      - YOLO11_URL=http://yolo11:8100
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - /home/sxz/Stockfish/src/stockfish:/usr/games/stockfish:ro
    depends_on:
      redis:
        condition: service_healthy
      chesscog:
        condition: service_started
      yolo11:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: jev-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly no
    volumes:
      - jev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cftunnel-jev-chess:
    image: cloudflare/cloudflared:latest
    container_name: cftunnel-jev-chess
    restart: unless-stopped
    network_mode: host
    profiles:
      - cloudflare
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --protocol http2 run

volumes:
  jev_redis_data:
  jev_postgres_data:
