name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jev-chess

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      # Runtime graph smoke (S6 incident): Docker entry = `node --experimental-strip-types
      # server.ts` — native Node ESM does NOT resolve tsconfig `@/` aliases. next build/tsc
      # both pass with `@/` imports inside the server.ts->lib/realtime graph, but the
      # container crash-loops at boot (ERR_MODULE_NOT_FOUND). This step loads the same
      # files the container loads, proving the alias graph is clean before the image ships.
      - name: Runtime graph load smoke (strip-types)
        run: |
          node --experimental-strip-types --no-warnings -e "
          (async () => {
            for (const m of ['./lib/realtime/ws-gateway.ts', './lib/realtime/tournament-sweeper.ts']) {
              const mod = await import(m);
              console.log('load OK:', m, Object.keys(mod).length, 'exports');
            }
            console.log('RUNTIME_GRAPH_OK');
          })().catch((e) => { console.error('RUNTIME_GRAPH_FAIL:', e.message); process.exit(1); });
          "

      - name: Build Next.js app
        run: npx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    name: Docker build${{ github.event_name == 'push' && ' & push to GHCR' || ' (no push)' }}
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
